[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-ptbr-pilot"
version = "0.1.0"
description = "Piloto de retrieval para RAG em artigos científicos em português brasileiro"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Augusto" }]
keywords = ["rag", "retrieval", "reranking", "bm25", "portuguese", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Dependências leves: importar o pacote NUNCA carrega torch/transformers nem baixa nada.
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Extração de PDF (ingestão)
ingest = [
    "pdfplumber>=0.11",
    "pypdf>=4.0",
]
# Embeddings + reranker (pesado; instalação do PyTorch é documentada no README)
models = [
    "torch>=2.3",
    "transformers>=4.51.0",
    "sentence-transformers>=2.7.0",
    "accelerate>=0.30",
    "huggingface-hub>=0.23",
]
# Geração opcional via Ollama (HTTP local)
generate = [
    "requests>=2.31",
]
# Desenvolvimento/testes
dev = [
    "pytest>=8.0",
]

[project.scripts]
rag-ptbr = "rag_ptbr_pilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_ptbr_pilot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: testes unitários rápidos sem modelos reais",
]
